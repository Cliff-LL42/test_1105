<title data-page-node-id="uJs3S2e5ofgy0iAKjDnNXd" data-pnid-children="yfhKkBFCxdET3i2BlWJzFz">国际象棋 · Chess</title>
<style data-page-node-id="5PJ80dbpceV3U697cBXEcq" data-pnid-children="3A9W6txqfbQrLVMFtTopPb">
  :root{
    --bg: #eef1f6;
    --panel: #ffffff;
    --line: #e3e7ef;
    --text: #1f2430;
    --text-dim: #6b7280;
    --accent: #2f7d5f;
    --accent-soft: #e3f2ea;
    --light-sq: #f0d9b5;
    --dark-sq: #b58863;
    --sel: #f6c445;
    --last: #f7d774;
    --shadow: 0 10px 30px rgba(31, 36, 48, .12);
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{ height: 100%; }
  body{
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #ffffff 0%, var(--bg) 60%);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    min-height: 100vh;
  }
  .app{
    display: flex;
    gap: 20px;
    align-items: flex-start;
    width: 100%;
    max-width: 1020px;
    justify-content: center;
  }

  /* ---------- 棋盘 ---------- */
  .board-col{
    --board: max(260px, min(88vw, 600px, calc(100vh - 180px)));
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .board-shell{
    width: var(--board);
    padding: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--shadow);
    position: relative;
  }
  .board{
    width: 100%;
    aspect-ratio: 1 / 1;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    border-radius: 10px;
    overflow: hidden;
    position: relative;
    user-select: none;
    touch-action: none;
  }
  .sq{
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .sq.light{ background: var(--light-sq); }
  .sq.dark{ background: var(--dark-sq); }
  .sq .mark{
    position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: transparent;
  }
  .sq.last .mark{ background: var(--last); opacity: .52; }
  .sq.sel .mark{ background: var(--sel); opacity: .62; }
  .sq.check .mark{
    background: radial-gradient(circle at 50% 50%, rgba(231,76,60,.95) 0%, rgba(231,76,60,.75) 38%, rgba(231,76,60,0) 72%);
    opacity: .95;
  }
  .sq.hover .mark{ box-shadow: inset 0 0 0 3px rgba(47,125,95,.85); }
  .sq .hint{
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
  }
  .sq .hint.dot::after{
    content: ""; position: absolute; left: 50%; top: 50%;
    width: 28%; height: 28%; transform: translate(-50%, -50%);
    border-radius: 50%; background: rgba(24, 28, 36, .24);
  }
  .sq .hint.cap::after{
    content: ""; position: absolute; inset: 6%;
    border-radius: 50%; border: 5px solid rgba(24, 28, 36, .24);
  }
  .piece{
    position: relative; z-index: 3;
    font-size: calc(var(--board) / 8 * 0.80);
    line-height: 1;
    cursor: grab;
    pointer-events: none;
  }
  .piece.w{ color: #fbfbfb; -webkit-text-stroke: 1.6px #3b3b3b; text-shadow: 0 2px 3px rgba(0,0,0,.32); }
  .piece.b{ color: #31353d; -webkit-text-stroke: 1.2px #16181c; text-shadow: 0 2px 3px rgba(0,0,0,.28); }
  .coord{
    position: absolute; z-index: 4; pointer-events: none;
    font-size: calc(var(--board) / 8 * 0.20);
    font-weight: 700;
    opacity: .62;
  }
  .coord.file{ right: 4%; bottom: 2%; }
  .coord.rank{ left: 5%; top: 2%; }
  .sq.light .coord{ color: #8a6a45; }
  .sq.dark .coord{ color: #f4e6d2; }

  .drag-ghost{
    position: fixed; z-index: 999; pointer-events: none;
    line-height: 1; transform: translate(-50%, -50%);
    filter: drop-shadow(0 6px 10px rgba(0,0,0,.35));
  }
  .drag-ghost.w{ color:#fbfbfb; -webkit-text-stroke: 1.6px #3b3b3b; }
  .drag-ghost.b{ color:#31353d; -webkit-text-stroke: 1.2px #16181c; }

  /* ---------- 状态条 ---------- */
  .statusbar{
    width: var(--board);
    display: flex; align-items: center; gap: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 10px 14px;
    box-shadow: 0 4px 14px rgba(31,36,48,.06);
    min-height: 54px;
  }
  .turn-dot{
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid #3b3b3b; background: #fff; flex: none;
    transition: background .2s;
  }
  .turn-dot.b{ background: #31353d; }
  .status-text{ font-size: 15px; font-weight: 600; }
  .status-sub{ font-size: 12.5px; color: var(--text-dim); margin-top: 2px; }
  .spinner{
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid #cfd6e2; border-top-color: var(--accent);
    animation: spin .7s linear infinite; margin-left: auto; flex: none;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  /* ---------- 侧栏 ---------- */
  .panel{
    width: 316px; flex: none;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .panel-head{
    padding: 14px 16px 12px;
    border-bottom: 1px solid var(--line);
  }
  .panel-head h1{
    margin: 0; font-size: 17px; letter-spacing: .5px;
    display: flex; align-items: center; gap: 8px;
  }
  .panel-head h1 span{ color: var(--accent); }
  .panel-head p{ margin: 4px 0 0; font-size: 12.5px; color: var(--text-dim); }
  .panel-body{ padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 14px; }

  .field-label{
    font-size: 11.5px; font-weight: 700; letter-spacing: .8px;
    color: var(--text-dim); text-transform: uppercase; margin-bottom: 7px;
  }
  .seg{ display: flex; background: #f2f4f8; border-radius: 10px; padding: 3px; gap: 3px; }
  .seg button{
    flex: 1; border: 0; background: transparent; cursor: pointer;
    padding: 7px 4px; border-radius: 8px;
    font-size: 13px; font-weight: 600; color: var(--text-dim);
    font-family: inherit; transition: all .15s;
  }
  .seg button:hover{ color: var(--text); }
  .seg button.on{ background: #fff; color: var(--accent); box-shadow: 0 1px 4px rgba(31,36,48,.12); }

  .row2{ display: flex; gap: 14px; }
  .row2 > div{ flex: 1; min-width: 0; }

  .actions{ display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn{
    font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    padding: 9px 10px; border-radius: 10px;
    border: 1px solid var(--line); background: #fff; color: var(--text);
    transition: all .15s;
  }
  .btn:hover{ background: #f7f9fc; border-color: #d3dae6; }
  .btn:active{ transform: translateY(1px); }
  .btn.primary{ background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover{ background: #276b51; }
  .btn:disabled{ opacity: .45; cursor: not-allowed; }

  .captured{
    display: flex; align-items: center; justify-content: space-between;
    background: #f7f9fc; border: 1px solid var(--line); border-radius: 10px;
    padding: 6px 10px; min-height: 38px;
  }
  .captured .side{
    display: flex; flex-wrap: wrap; align-items: center; gap: 1px;
    font-size: 21px; line-height: 1.05; max-width: 78%;
  }
  .captured .side .g.w{ color:#fff; -webkit-text-stroke:1.1px #3b3b3b; }
  .captured .side .g.b{ color:#3a3f48; -webkit-text-stroke:.9px #16181c; }
  .captured .adv{ font-size: 12px; font-weight: 700; color: var(--accent); }

  .moves-wrap{
    border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
    background: #fcfdff;
  }
  .moves-head{
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px; font-size: 11.5px; font-weight: 700; letter-spacing: .8px;
    color: var(--text-dim); text-transform: uppercase;
    border-bottom: 1px solid var(--line); background: #f7f9fc;
  }
  .moves{ height: 150px; overflow-y: auto; padding: 6px 4px 8px; }
  .moves::-webkit-scrollbar{ width: 8px; }
  .moves::-webkit-scrollbar-thumb{ background: #d8dfe9; border-radius: 4px; }
  .mv-row{ display: grid; grid-template-columns: 34px 1fr 1fr; align-items: center; }
  .mv-row .no{ font-size: 11.5px; color: #9aa3b2; text-align: center; font-variant-numeric: tabular-nums; }
  .mv-cell{
    font-size: 13.5px; font-weight: 600; padding: 3px 8px; border-radius: 6px;
    font-variant-numeric: tabular-nums; cursor: default;
  }
  .mv-cell.last{ background: var(--accent-soft); color: #1e5a43; }
  .mv-row:nth-child(odd){ background: #fbfcfe; }
  .empty-moves{ font-size: 12.5px; color: #a6aebb; text-align: center; padding: 30px 0; }

  .panel-foot{
    padding: 11px 16px; border-top: 1px solid var(--line);
    font-size: 11.5px; color: #9aa3b2; text-align: center; background: #fafbfd;
  }

  /* ---------- 升变弹窗 ---------- */
  .overlay{
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(24,28,36,.42);
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(2px);
  }
  .overlay[hidden]{ display: none; }
  .promo-card{
    background: #fff; border-radius: 16px; padding: 18px 20px 16px;
    box-shadow: 0 20px 50px rgba(0,0,0,.28); text-align: center;
  }
  .promo-card p{ margin: 0 0 12px; font-size: 14px; font-weight: 700; }
  .promo-opts{ display: flex; gap: 10px; }
  .promo-opts button{
    width: 62px; height: 62px; border-radius: 12px; cursor: pointer;
    border: 1px solid var(--line); background: #f7f9fc;
    font-size: 38px; line-height: 1; font-family: inherit;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s;
  }
  .promo-opts button:hover{ background: var(--accent-soft); border-color: var(--accent); transform: translateY(-2px); }
  .promo-opts button.w{ color:#fff; -webkit-text-stroke:1.6px #3b3b3b; }
  .promo-opts button.b{ color:#31353d; -webkit-text-stroke:1.2px #16181c; }

  .toast{
    position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%);
    background: rgba(31,36,48,.92); color: #fff; font-size: 13.5px; font-weight: 600;
    padding: 10px 18px; border-radius: 999px; z-index: 1200;
    box-shadow: 0 8px 24px rgba(0,0,0,.25);
    animation: rise .25s ease-out;
  }
  @keyframes rise{ from{ opacity: 0; transform: translate(-50%, 12px); } to{ opacity: 1; transform: translate(-50%, 0); } }

  @media (max-width: 900px){
    body{ align-items: flex-start; padding: 14px 12px 26px; }
    .app{ flex-direction: column; align-items: center; gap: 14px; }
    .board-col{ --board: min(92vw, 560px); width: 100%; align-items: center; }
    .panel{ width: min(92vw, 560px); }
    .moves{ height: 130px; }
  }
</style>
</head>

<script data-page-node-id="fyOEsNqv3mPolDv958OusZ" data-pnid-children="XRHjEWcOJwpPUb0uzkyXn3" id="engine">
/* =========================================================================
   国际象棋引擎（纯逻辑，无 DOM 依赖）—— 可独立用于 perft 校验
   棋盘索引：0 = a8 … 63 = h1，index = row * 8 + col，row 0 为黑方底线
   ========================================================================= */
var FILES = 'abcdefgh';
var START_FEN = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
var GLYPH = { k:'\u265A', q:'\u265B', r:'\u265C', b:'\u265D', n:'\u265E', p:'\u265F' };
var PIECE_NAME = { k:'王', q:'后', r:'车', b:'象', n:'马', p:'兵' };

var KNIGHT_DELTAS = [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
var BISHOP_DIRS   = [[-1,-1],[-1,1],[1,-1],[1,1]];
var ROOK_DIRS     = [[-1,0],[1,0],[0,-1],[0,1]];
var KING_DIRS     = BISHOP_DIRS.concat(ROOK_DIRS);

function other(c){ return c === 'w' ? 'b' : 'w'; }
function rc(i){ return [i >> 3, i & 7]; }
function sqName(i){ return FILES[i & 7] + (8 - (i >> 3)); }
function sqIndex(name){ return (8 - parseInt(name[1], 10)) * 8 + FILES.indexOf(name[0]); }
function onBoard(r, c){ return r >= 0 && r < 8 && c >= 0 && c < 8; }

function initialBoard(){
  var b = new Array(64).fill(null);
  var back = ['r','n','b','q','k','b','n','r'];
  for(var c = 0; c < 8; c++){
    b[c]        = { t: back[c], c: 'b' };
    b[8 + c]    = { t: 'p', c: 'b' };
    b[48 + c]   = { t: 'p', c: 'w' };
    b[56 + c]   = { t: back[c], c: 'w' };
  }
  return b;
}

function newState(){
  return {
    board: initialBoard(),
    turn: 'w',
    castling: { wK:true, wQ:true, bK:true, bQ:true },
    ep: -1,
    half: 0,
    full: 1
  };
}

function cloneState(st){
  return {
    board: st.board.slice(),
    turn: st.turn,
    castling: { wK: st.castling.wK, wQ: st.castling.wQ, bK: st.castling.bK, bQ: st.castling.bQ },
    ep: st.ep,
    half: st.half,
    full: st.full
  };
}

function fenToState(fen){
  var parts = fen.trim().split(/\s+/);
  var board = new Array(64).fill(null);
  var i = 0;
  for(var k = 0; k < parts[0].length; k++){
    var ch = parts[0][k];
    if(ch === '/') continue;
    if(ch >= '1' && ch <= '8'){ i += parseInt(ch, 10); continue; }
    board[i++] = { t: ch.toLowerCase(), c: (ch === ch.toUpperCase() ? 'w' : 'b') };
  }
  var cs = parts[2] || '-';
  return {
    board: board,
    turn: parts[1] || 'w',
    castling: { wK: cs.indexOf('K') >= 0, wQ: cs.indexOf('Q') >= 0, bK: cs.indexOf('k') >= 0, bQ: cs.indexOf('q') >= 0 },
    ep: (parts[3] && parts[3] !== '-') ? sqIndex(parts[3]) : -1,
    half: parseInt(parts[4] || '0', 10),
    full: parseInt(parts[5] || '1', 10)
  };
}

function positionKey(st){
  var s = '';
  for(var i = 0; i < 64; i++){
    var p = st.board[i];
    s += p ? (p.c === 'w' ? p.t.toUpperCase() : p.t) : '.';
  }
  return s + '|' + st.turn + '|' + (st.castling.wK?'K':'') + (st.castling.wQ?'Q':'') +
         (st.castling.bK?'k':'') + (st.castling.bQ?'q':'') + '|' + st.ep;
}

function kingIndex(st, color){
  for(var i = 0; i < 64; i++){
    var p = st.board[i];
    if(p && p.c === color && p.t === 'k') return i;
  }
  return -1;
}

function isAttacked(st, sq, by){
  var b = st.board;
  var p = rc(sq), r = p[0], c = p[1], x, dr, dc, rr, cc, t;

  // 兵
  var pd = (by === 'w') ? 1 : -1;
  for(var d = -1; d <= 1; d += 2){
    rr = r + pd; cc = c + d;
    if(onBoard(rr, cc)){ t = b[rr * 8 + cc]; if(t && t.c === by && t.t === 'p') return true; }
  }
  // 马
  for(var i = 0; i < KNIGHT_DELTAS.length; i++){
    dr = KNIGHT_DELTAS[i][0]; dc = KNIGHT_DELTAS[i][1];
    rr = r + dr; cc = c + dc;
    if(onBoard(rr, cc)){ t = b[rr * 8 + cc]; if(t && t.c === by && t.t === 'n') return true; }
  }
  // 王
  for(var j = 0; j < KING_DIRS.length; j++){
    dr = KING_DIRS[j][0]; dc = KING_DIRS[j][1];
    rr = r + dr; cc = c + dc;
    if(onBoard(rr, cc)){ t = b[rr * 8 + cc]; if(t && t.c === by && t.t === 'k') return true; }
  }
  // 象 / 后（斜线）
  for(var m = 0; m < BISHOP_DIRS.length; m++){
    dr = BISHOP_DIRS[m][0]; dc = BISHOP_DIRS[m][1];
    rr = r + dr; cc = c + dc;
    while(onBoard(rr, cc)){
      t = b[rr * 8 + cc];
      if(t){ if(t.c === by && (t.t === 'b' || t.t === 'q')) return true; break; }
      rr += dr; cc += dc;
    }
  }
  // 车 / 后（直线）
  for(var n = 0; n < ROOK_DIRS.length; n++){
    dr = ROOK_DIRS[n][0]; dc = ROOK_DIRS[n][1];
    rr = r + dr; cc = c + dc;
    while(onBoard(rr, cc)){
      t = b[rr * 8 + cc];
      if(t){ if(t.c === by && (t.t === 'r' || t.t === 'q')) return true; break; }
      rr += dr; cc += dc;
    }
  }
  return false;
}

function inCheck(st, color){
  var k = kingIndex(st, color);
  if(k < 0) return false;
  return isAttacked(st, k, other(color));
}

function addPawnMove(list, from, to, captured, isPromo){
  if(isPromo){
    var promos = ['q','r','b','n'];
    for(var i = 0; i < promos.length; i++){
      list.push({ from: from, to: to, piece: 'p', color: null, captured: captured, promo: promos[i] });
    }
  } else {
    list.push({ from: from, to: to, piece: 'p', color: null, captured: captured, promo: null });
  }
}

function genPseudo(st, color){
  var moves = [];
  var b = st.board;
  var opp = other(color);

  for(var i = 0; i < 64; i++){
    var pc = b[i];
    if(!pc || pc.c !== color) continue;
    var pos = rc(i), r = pos[0], c = pos[1], dr, dc, rr, cc, t, j, m;

    if(pc.t === 'p'){
      var dir = (color === 'w') ? -1 : 1;
      var startRow = (color === 'w') ? 6 : 1;
      var promoRow = (color === 'w') ? 0 : 7;
      var r1 = r + dir;

      // 前进一格 / 两格
      if(r1 >= 0 && r1 < 8 && !b[r1 * 8 + c]){
        addPawnMove(moves, i, r1 * 8 + c, null, r1 === promoRow);
        var r2 = r + 2 * dir;
        if(r === startRow && !b[r2 * 8 + c]){
          moves.push({ from: i, to: r2 * 8 + c, piece: 'p', color: color, captured: null, promo: null, dbl: true });
        }
      }
      // 斜吃 / 吃过路兵
      for(var d = -1; d <= 1; d += 2){
        cc = c + d;
        if(cc < 0 || cc > 7 || r1 < 0 || r1 > 7) continue;
        t = r1 * 8 + cc;
        var tp = b[t];
        if(tp && tp.c === opp){
          addPawnMove(moves, i, t, tp.t, r1 === promoRow);
        } else if(!tp && st.ep === t){
          moves.push({ from: i, to: t, piece: 'p', color: color, captured: 'p', promo: null, ep: true });
        }
      }
      continue;
    }

    var deltas = null;
    if(pc.t === 'n') deltas = KNIGHT_DELTAS;
    else if(pc.t === 'b') deltas = BISHOP_DIRS;
    else if(pc.t === 'r') deltas = ROOK_DIRS;
    else if(pc.t === 'q') deltas = KING_DIRS;
    else if(pc.t === 'k') deltas = KING_DIRS;

    var sliding = (pc.t === 'b' || pc.t === 'r' || pc.t === 'q');
    for(j = 0; j < deltas.length; j++){
      dr = deltas[j][0]; dc = deltas[j][1];
      rr = r + dr; cc = c + dc;
      while(onBoard(rr, cc)){
        t = rr * 8 + cc;
        var q = b[t];
        if(!q){
          moves.push({ from: i, to: t, piece: pc.t, color: color, captured: null, promo: null });
        } else {
          if(q.c === opp) moves.push({ from: i, to: t, piece: pc.t, color: color, captured: q.t, promo: null });
          break;
        }
        if(!sliding) break;
        rr += dr; cc += dc;
      }
    }

    // 王车易位
    if(pc.t === 'k'){
      var homeRow = (color === 'w') ? 7 : 0;
      if(r === homeRow && c === 4 && !inCheck(st, color)){
        var kRight = (color === 'w') ? st.castling.wK : st.castling.bK;
        var qRight = (color === 'w') ? st.castling.wQ : st.castling.bQ;
        var base = homeRow * 8;
        if(kRight && !b[base + 5] && !b[base + 6] &&
           !isAttacked(st, base + 5, opp) && !isAttacked(st, base + 6, opp)){
          moves.push({ from: i, to: base + 6, piece: 'k', color: color, captured: null, promo: null, castle: 'k' });
        }
        if(qRight && !b[base + 1] && !b[base + 2] && !b[base + 3] &&
           !isAttacked(st, base + 3, opp) && !isAttacked(st, base + 2, opp)){
          moves.push({ from: i, to: base + 2, piece: 'k', color: color, captured: null, promo: null, castle: 'q' });
        }
      }
    }
  }
  return moves;
}

function makeMove(st, m){
  var ns = cloneState(st);
  var b = ns.board;
  var p = b[m.from];
  var mover = p.c;

  b[m.from] = null;

  // 吃过路兵：拿掉被吃的兵
  if(m.ep){
    var tr = rc(m.to), cr = tr[0] + ((mover === 'w') ? 1 : -1);
    b[cr * 8 + (m.to & 7)] = null;
  }
  b[m.to] = m.promo ? { t: m.promo, c: mover } : { t: p.t, c: mover };

  if(p.t === 'p' || m.captured) ns.half = 0; else ns.half = st.half + 1;
  if(m.dbl) ns.ep = (m.from + m.to) / 2; else ns.ep = -1;

  // 易位：同步移动车
  if(m.castle){
    var row = m.from >> 3;
    if(m.castle === 'k'){ b[row * 8 + 5] = b[row * 8 + 7]; b[row * 8 + 7] = null; }
    else { b[row * 8 + 3] = b[row * 8 + 0]; b[row * 8 + 0] = null; }
  }

  // 易位权
  if(p.t === 'k'){
    if(mover === 'w'){ ns.castling.wK = false; ns.castling.wQ = false; }
    else { ns.castling.bK = false; ns.castling.bQ = false; }
  }
  if(m.from === 63 || m.to === 63) ns.castling.wK = false;
  if(m.from === 56 || m.to === 56) ns.castling.wQ = false;
  if(m.from === 7  || m.to === 7 ) ns.castling.bK = false;
  if(m.from === 0  || m.to === 0 ) ns.castling.bQ = false;

  ns.turn = other(st.turn);
  ns.full = st.full + (st.turn === 'b' ? 1 : 0);
  return ns;
}

function legalMoves(st, color){
  color = color || st.turn;
  var pseudo = genPseudo(st, color);
  var res = [];
  for(var i = 0; i < pseudo.length; i++){
    var ns = makeMove(st, pseudo[i]);
    if(!inCheck(ns, color)) res.push(pseudo[i]);
  }
  return res;
}

function moveSAN(st, m){
  var legal = legalMoves(st, st.turn);
  var san;

  if(m.castle){
    san = (m.castle === 'k') ? 'O-O' : 'O-O-O';
  } else {
    var p = st.board[m.from];
    var s = '';
    if(p.t === 'p'){
      if(m.captured) s += FILES[m.from & 7] + 'x';
      s += sqName(m.to);
      if(m.promo) s += '=' + m.promo.toUpperCase();
    } else {
      s += p.t.toUpperCase();
      var others = [];
      for(var i = 0; i < legal.length; i++){
        var x = legal[i];
        if(x.from === m.from && x.to === m.to) continue;
        var xp = st.board[x.from];
        if(xp && xp.t === p.t && xp.c === p.c && x.to === m.to) others.push(x);
      }
      if(others.length){
        var sameFile = false, sameRank = false;
        for(var j = 0; j < others.length; j++){
          if((others[j].from & 7) === (m.from & 7)) sameFile = true;
          if((others[j].from >> 3) === (m.from >> 3)) sameRank = true;
        }
        if(!sameFile) s += FILES[m.from & 7];
        else if(!sameRank) s += (8 - (m.from >> 3));
        else s += sqName(m.from);
      }
      if(m.captured) s += 'x';
      s += sqName(m.to);
    }
    san = s;
  }

  var ns = makeMove(st, m);
  if(inCheck(ns, ns.turn)){
    san += legalMoves(ns, ns.turn).length ? '+' : '#';
  }
  return san;
}

function mirror(i){ return (7 - (i >> 3)) * 8 + (i & 7); }

function isEndgame(st){
  var total = 0;
  for(var i = 0; i < 64; i++){
    var p = st.board[i];
    if(!p || p.t === 'k' || p.t === 'p') continue;
    total += VAL[p.t];
  }
  return total <= 1300;
}

function evaluate(st){
  var score = 0, i, p, end = isEndgame(st);
  var wBishops = 0, bBishops = 0;

  for(i = 0; i < 64; i++){
    p = st.board[i];
    if(!p) continue;
    if(p.c === 'w'){
      score += VAL[p.t];
      score += (p.t === 'k' ? (end ? PST.kEnd[i] : PST.k[i]) : PST[p.t][i]);
      if(p.t === 'b') wBishops++;
    } else {
      var mi = mirror(i);
      score -= VAL[p.t];
      score -= (p.t === 'k' ? (end ? PST.kEnd[mi] : PST.k[mi]) : PST[p.t][mi]);
      if(p.t === 'b') bBishops++;
    }
  }
  if(wBishops >= 2) score += 32;
  if(bBishops >= 2) score -= 32;
  return score;
}

function evaluateForTurn(st){
  var s = evaluate(st);
  return st.turn === 'w' ? s : -s;
}

function insufficientMaterial(st){
  var counts = { w: {}, b: {} }, squares = [];
  for(var i = 0; i < 64; i++){
    var p = st.board[i];
    if(!p) continue;
    counts[p.c][p.t] = (counts[p.c][p.t] || 0) + 1;
    squares.push({ p: p, i: i });
  }
  if(counts.w.p || counts.b.p) return false;
  if((counts.w.q || counts.b.q) || (counts.w.r || counts.b.r)) return false;
  var minors = squares.filter(function(x){ return x.p.t === 'b' || x.p.t === 'n'; });
  if(minors.length <= 1) return true;
  if(minors.length === 2 && minors[0].p.t === 'b' && minors[1].p.t === 'b' && minors[0].p.c !== minors[1].p.c){
    var c1 = ((minors[0].i >> 3) + (minors[0].i & 7)) & 1;
    var c2 = ((minors[1].i >> 3) + (minors[1].i & 7)) & 1;
    if(c1 === c2) return true;
  }
  return false;
}

/* ------------------------- 搜索 ------------------------- */
var MATE = 100000;

function orderMoves(st, moves){
  for(var i = 0; i < moves.length; i++){
    var m = moves[i], s = 0;
    if(m.captured) s += 10 * VAL[m.captured] - VAL[m.piece];
    if(m.promo) s += VAL[m.promo];
    if(m.castle) s += 40;
    m._s = s;
  }
  moves.sort(function(a, b){ return b._s - a._s; });
  return moves;
}

var TIMEOUT = { timeout: true };
var searchDeadline = 0;
var searchNodes = 0;

function tick(){
  searchNodes++;
  if((searchNodes & 511) === 0 && Date.now() > searchDeadline) throw TIMEOUT;
}

function quiesce(st, alpha, beta, depth){
  tick();
  var stand = evaluateForTurn(st);
  if(depth <= 0) return stand;
  if(stand >= beta) return beta;
  if(stand > alpha) alpha = stand;

  var all = legalMoves(st, st.turn);
  var caps = [];
  for(var i = 0; i < all.length; i++) if(all[i].captured || all[i].promo) caps.push(all[i]);
  orderMoves(st, caps);

  for(var j = 0; j < caps.length; j++){
    var ns = makeMove(st, caps[j]);
    var score = -quiesce(ns, -beta, -alpha, depth - 1);
    if(score >= beta) return beta;
    if(score > alpha) alpha = score;
  }
  return alpha;
}

function negamax(st, depth, alpha, beta, ply, useQ){
  tick();
  var moves = legalMoves(st, st.turn);
  if(!moves.length){
    if(inCheck(st, st.turn)) return -MATE + ply;
    return 0;
  }
  if(depth <= 0){
    return useQ ? quiesce(st, alpha, beta, 3) : evaluateForTurn(st);
  }
  orderMoves(st, moves);
  var best = -Infinity;
  for(var i = 0; i < moves.length; i++){
    var ns = makeMove(st, moves[i]);
    var score = -negamax(ns, depth - 1, -beta, -alpha, ply + 1, useQ);
    if(score > best) best = score;
    if(best > alpha) alpha = best;
    if(alpha >= beta) break;
  }
  return best;
}

function searchRoot(st, depth, useQ, noise){
  var ordered = orderMoves(st, legalMoves(st, st.turn).slice());
  var alpha = -Infinity, bestScore = -Infinity, bestList = [];

  for(var i = 0; i < ordered.length; i++){
    var ns = makeMove(st, ordered[i]);
    // 先用零窗口快速判断是否比当前最优更好
    var score = -negamax(ns, depth - 1, -Infinity, -alpha, 1, useQ);

    if(score > alpha){
      // 用完整窗口重搜，取得精确分值，避免"伪平局"污染候选列表
      score = -negamax(ns, depth - 1, -Infinity, Infinity, 1, useQ);
      if(noise) score += (Math.random() * 2 - 1) * noise;
      if(score > bestScore + 0.001){
        bestScore = score; bestList = [ordered[i]];
        if(score > alpha) alpha = score;
      } else if(Math.abs(score - bestScore) <= 0.001){
        bestList.push(ordered[i]);
      }
    } else if(noise){
      // 低难度：给次优着法一点噪声，模拟人类失误
      score += (Math.random() * 2 - 1) * noise;
      if(score > bestScore){
        bestScore = score; bestList = [ordered[i]];
      }
    }
  }
  return { move: bestList[(Math.random() * bestList.length) | 0], score: bestScore };
}

/* level: 1 简单 / 2 中等 / 3 困难 —— 迭代加深 + 时间上限 */
function bestMove(st, level){
  var moves = legalMoves(st, st.turn);
  if(!moves.length) return null;

  // 简单难度：偶尔随机走一步，模拟失误
  if(level === 1 && Math.random() < 0.20){
    return moves[(Math.random() * moves.length) | 0];
  }

  var maxDepth = (level === 3) ? 5 : (level === 2 ? 3 : 1);
  var budget   = (level === 3) ? 2000 : 1200;
  var useQ     = level >= 2;
  var noise    = (level === 1) ? 70 : (level === 2 ? 16 : 0);

  searchDeadline = Date.now() + budget;
  searchNodes = 0;

  var best = moves[0];
  for(var d = 1; d <= maxDepth; d++){
    try {
      var r = searchRoot(st, d, useQ, noise);
      best = r.move;
      if(Math.abs(r.score) > MATE - 200) break; // 已找到杀棋
    } catch(e){
      if(e !== TIMEOUT) throw e;
      break;
    }
  }
  return best;
}

/* -------- perft（测试用，可在 Node 中单独调用） -------- */
function perft(st, depth){
  if(depth === 0) return 1;
  var moves = legalMoves(st, st.turn);
  if(depth === 1) return moves.length;
  var nodes = 0;
  for(var i = 0; i < moves.length; i++){
    nodes += perft(makeMove(st, moves[i]), depth - 1);
  }
  return nodes;
}
</script>

<script data-page-node-id="9n36hOGnpkx61n2gXG4sKn" data-pnid-children="81MupV6qYtf9hC8KVtRU9L" id="ui">
(function(){
  'use strict';

  var boardEl = document.getElementById('board');
  var turnDot = document.getElementById('turnDot');
  var statusText = document.getElementById('statusText');
  var statusSub = document.getElementById('statusSub');
  var spinner = document.getElementById('spinner');
  var movesEl = document.getElementById('moves');
  var moveCountEl = document.getElementById('moveCount');
  var capByWhiteEl = document.getElementById('capByWhite');
  var capByBlackEl = document.getElementById('capByBlack');
  var advWhiteEl = document.getElementById('advWhite');
  var advBlackEl = document.getElementById('advBlack');
  var promoOverlay = document.getElementById('promoOverlay');
  var promoOpts = document.getElementById('promoOpts');

  var soundOn = true;
  var settings = { mode: 'pve', human: 'w', level: 2 };
  var flipped = false;
  var game, history, keyCounts, allLegal, lastMove, ended, endText, aiThinking;
  var sel = null, selMoves = [], hintFlash = null, toastTimer = null;
  var drag = null;

  /* ---------------- 音效 ---------------- */
  var audioCtx = null;
  function ensureAudio(){
    if(!audioCtx){
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ audioCtx = null; }
    }
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function tone(freq, dur, type, vol, delay){
    if(!soundOn) return;
    ensureAudio();
    if(!audioCtx) return;
    var t0 = audioCtx.currentTime + (delay || 0);
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type || 'triangle';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(vol || 0.14, t0 + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  }
  function sfx(kind){
    if(!soundOn) return;
    if(kind === 'move') tone(300, 0.09, 'triangle', 0.12);
    else if(kind === 'capture'){ tone(150, 0.14, 'sawtooth', 0.12); tone(90, 0.16, 'triangle', 0.1, 0.02); }
    else if(kind === 'castle'){ tone(260, 0.08, 'triangle', 0.11); tone(360, 0.1, 'triangle', 0.1, 0.07); }
    else if(kind === 'check'){ tone(720, 0.1, 'sine', 0.14); tone(920, 0.12, 'sine', 0.12, 0.09); }
    else if(kind === 'promo'){ tone(440, 0.09, 'sine', 0.13); tone(660, 0.09, 'sine', 0.13, 0.08); tone(880, 0.14, 'sine', 0.13, 0.16); }
    else if(kind === 'end'){ tone(520, 0.16, 'sine', 0.14); tone(392, 0.18, 'sine', 0.13, 0.14); tone(262, 0.3, 'sine', 0.14, 0.28); }
    else if(kind === 'illegal') tone(120, 0.1, 'square', 0.07);
  }

  /* ---------------- 状态初始化 ---------------- */
  function newGame(){
    game = newState();
    history = [];
    keyCounts = {};
    keyCounts[positionKey(game)] = 1;
    allLegal = legalMoves(game);
    lastMove = null;
    ended = false;
    endText = '';
    aiThinking = false;
    sel = null; selMoves = []; hintFlash = null;
    promoOverlay.hidden = true;
    statusSub.textContent = settings.mode === 'pve'
      ? (settings.human === 'w' ? '你执白先行' : '电脑执白先行')
      : '点击或拖拽棋子移动';
    render();
    if(settings.mode === 'pve' && game.turn !== settings.human) scheduleAI();
  }

  function canMoveSide(color){
    if(ended) return false;
    if(aiThinking) return false;
    if(settings.mode === 'pve' && color !== settings.human) return false;
    return true;
  }

  /* ---------------- 棋盘 DOM ---------------- */
  function buildBoard(){
    boardEl.innerHTML = '';
    for(var dr = 0; dr < 8; dr++){
      for(var dc = 0; dc < 8; dc++){
        var r = flipped ? 7 - dr : dr;
        var c = flipped ? 7 - dc : dc;
        var idx = r * 8 + c;
        var sq = document.createElement('div');
        sq.className = 'sq ' + (((r + c) % 2 === 0) ? 'light' : 'dark');
        sq.dataset.idx = String(idx);

        var mark = document.createElement('span'); mark.className = 'mark'; sq.appendChild(mark);
        var hint = document.createElement('span'); hint.className = 'hint'; sq.appendChild(hint);

        if(dr === 7){
          var f = document.createElement('span');
          f.className = 'coord file'; f.textContent = FILES[c]; sq.appendChild(f);
        }
        if(dc === 0){
          var k = document.createElement('span');
          k.className = 'coord rank'; k.textContent = String(8 - r); sq.appendChild(k);
        }
        boardEl.appendChild(sq);
      }
    }
  }

  function squareEl(idx){
    var kids = boardEl.children;
    for(var i = 0; i < kids.length; i++) if(+kids[i].dataset.idx === idx) return kids[i];
    return null;
  }

  function render(){
    var kids = boardEl.children;
    for(var d = 0; d < kids.length; d++){
      var sq = kids[d];
      var idx = +sq.dataset.idx;

      var old = sq.querySelector('.piece');
      if(old) old.remove();
      var hint = sq.querySelector('.hint');
      hint.className = 'hint';

      sq.classList.toggle('sel', sel === idx);
      sq.classList.toggle('last', !!lastMove && (lastMove.from === idx || lastMove.to === idx));
      sq.classList.toggle('check', !ended && inCheck(game, game.turn) && kingIndex(game, game.turn) === idx);
      sq.classList.remove('hover');

      if(hintFlash && (hintFlash.from === idx || hintFlash.to === idx)) sq.classList.add('last');

      if(sel !== null){
        for(var i = 0; i < selMoves.length; i++){
          if(selMoves[i].to === idx){
            hint.className = 'hint ' + (selMoves[i].captured || selMoves[i].ep ? 'cap' : 'dot');
            break;
          }
        }
      }

      var p = game.board[idx];
      if(p){
        var el = document.createElement('span');
        el.className = 'piece ' + p.c;
        el.textContent = GLYPH[p.t];
        sq.appendChild(el);
      }
    }
    renderStatus();
    renderCaptured();
    renderMoves();
  }

  function renderStatus(){
    turnDot.className = 'turn-dot' + (game.turn === 'b' ? ' b' : '');
    spinner.hidden = !aiThinking;

    if(ended){
      statusText.textContent = endText;
      return;
    }
    var sideName = game.turn === 'w' ? '白方' : '黑方';
    if(settings.mode === 'pve'){
      sideName += (game.turn === settings.human) ? '（你）' : '（电脑）';
    }
    var chk = inCheck(game, game.turn);
    statusText.textContent = sideName + '走棋' + (chk ? ' · 将军！' : '');
    if(aiThinking) statusSub.textContent = '电脑思考中…';
    else if(sel !== null) statusSub.textContent = '已选中 ' + sqName(sel) + '，请选择落点';
    else statusSub.textContent = '第 ' + game.full + ' 回合';
  }

  function glyphCounts(){
    var start = { p:8, n:2, b:2, r:2, q:1, k:1 };
    var now = { w:{}, b:{} };
    for(var i = 0; i < 64; i++){
      var p = game.board[i];
      if(!p) continue;
      now[p.c][p.t] = (now[p.c][p.t] || 0) + 1;
    }
    var lost = { w:[], b:[] };
    ['p','n','b','r','q'].forEach(function(t){
      ['w','b'].forEach(function(col){
        var n = start[t] - (now[col][t] || 0);
        for(var k = 0; k < n; k++) lost[col].push(t);
      });
    });
    return lost;
  }

  function renderCaptured(){
    var lost = glyphCounts();
    // 白方被吃掉的子 → 由黑方缴获
    capByBlackEl.innerHTML = lost.w.map(function(t){ return '<span class="g w">' + GLYPH[t] + '</span>'; }).join('');
    capByWhiteEl.innerHTML = lost.b.map(function(t){ return '<span class="g b">' + GLYPH[t] + '</span>'; }).join('');
    var diff = 0;
    lost.w.forEach(function(t){ diff -= VAL[t]; });
    lost.b.forEach(function(t){ diff += VAL[t]; });
    advWhiteEl.textContent = diff > 0 ? '+' + Math.round(diff / 100) : '';
    advBlackEl.textContent = diff < 0 ? '+' + Math.round(-diff / 100) : '';
  }

  function renderMoves(){
    if(!history.length){
      movesEl.innerHTML = '<div class="empty-moves">尚无走子</div>';
      moveCountEl.textContent = '0 步';
      return;
    }
    var html = '';
    for(var i = 0; i < history.length; i += 2){
      var no = (i / 2) + 1;
      var w = history[i] ? history[i].san : '';
      var b = history[i + 1] ? history[i + 1].san : '';
      var wLast = (i === history.length - 1) ? ' last' : '';
      var bLast = (i + 1 === history.length - 1) ? ' last' : '';
      html += '<div class="mv-row"><div class="no">' + no + '.</div>' +
              '<div class="mv-cell' + wLast + '">' + w + '</div>' +
              '<div class="mv-cell' + bLast + '">' + b + '</div></div>';
    }
    movesEl.innerHTML = html;
    moveCountEl.textContent = history.length + ' 步';
    movesEl.scrollTop = movesEl.scrollHeight;
  }

  function toast(msg){
    var el = document.querySelector('.toast');
    if(el) el.remove();
    el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    document.body.appendChild(el);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ if(el.parentNode) el.remove(); }, 1900);
  }

  /* ---------------- 走子 ---------------- */
  function checkGameEnd(){
    var legal = allLegal.length;
    var inChk = inCheck(game, game.turn);

    if(legal === 0){
      ended = true;
      if(inChk){
        var winner = game.turn === 'w' ? '黑方' : '白方';
        endText = winner + '胜 · 将杀';
      } else {
        endText = '和棋 · 逼和';
      }
      if(settings.mode === 'pve'){
        var won = inChk && (game.turn !== settings.human);
        endText += won ? '（你赢了）' : (settings.mode === 'pve' && inChk ? '（你输了）' : '');
      }
      sfx('end');
      return true;
    }
    if(game.half >= 100){ ended = true; endText = '和棋 · 50 回合规则'; sfx('end'); return true; }
    if(keyCounts[positionKey(game)] >= 3){ ended = true; endText = '和棋 · 三次重复局面'; sfx('end'); return true; }
    if(insufficientMaterial(game)){ ended = true; endText = '和棋 · 子力不足'; sfx('end'); return true; }
    return false;
  }

  function applyMove(m){
    var san = moveSAN(game, m);
    var wasCapture = !!m.captured;
    var wasCheck;

    history.push({ state: cloneState(game), move: m, san: san });
    game = makeMove(game, m);
    lastMove = m;
    sel = null; selMoves = []; hintFlash = null;

    var key = positionKey(game);
    keyCounts[key] = (keyCounts[key] || 0) + 1;

    allLegal = legalMoves(game);
    wasCheck = inCheck(game, game.turn);

    if(m.promo) sfx('promo');
    else if(m.castle) sfx('castle');
    else if(wasCapture) sfx('capture');
    else sfx('move');
    if(wasCheck && !ended) setTimeout(function(){ sfx('check'); }, 130);

    render();

    if(!checkGameEnd()){
      if(settings.mode === 'pve' && game.turn !== settings.human) scheduleAI();
    } else {
      render();
      toast(endText);
    }
  }

  function attemptMove(m){
    if(ended || aiThinking) return;
    applyMove(m);
  }

  function scheduleAI(){
    aiThinking = true;
    renderStatus();
    setTimeout(function(){
      var m = null;
      try { m = bestMove(game, settings.level); } catch(e){ m = null; }
      aiThinking = false;
      if(!m){ var lm = legalMoves(game); m = lm.length ? lm[0] : null; }
      if(m) applyMove(m); else render();
    }, 90);
  }

  /* ---------------- 交互：点击 + 拖拽 ---------------- */
  function legalFrom(idx){
    var res = [];
    for(var i = 0; i < allLegal.length; i++) if(allLegal[i].from === idx) res.push(allLegal[i]);
    return res;
  }

  function findMoveTo(idx){
    var list = [], i;
    for(i = 0; i < selMoves.length; i++) if(selMoves[i].to === idx) list.push(selMoves[i]);
    return list;
  }

  function onPointerDown(e){
    if(e.button !== undefined && e.button !== 0) return;
    var sqEl = e.target.closest ? e.target.closest('.sq') : null;
    if(!sqEl) return;
    var idx = +sqEl.dataset.idx;
    var piece = game.board[idx];

    // 已有选中：落点命中则走子
    if(sel !== null && sel !== idx){
      var cands = findMoveTo(idx);
      if(cands.length){
        e.preventDefault();
        if(cands.length > 1){
          askPromotion(cands);
        } else if(canMoveSide(game.turn)){
          attemptMove(cands[0]);
        }
        return;
      }
    }

    if(piece && piece.c === game.turn && canMoveSide(piece.c)){
      e.preventDefault();
      sel = idx;
      selMoves = legalFrom(idx);
      hintFlash = null;
      render();
      startDrag(e, idx);
      return;
    }

    if(sel !== null){ sel = null; selMoves = []; render(); }
  }

  function startDrag(e, idx){
    var rect = boardEl.getBoundingClientRect();
    var size = rect.width / 8;
    var p = game.board[idx];
    var ghost = document.createElement('div');
    ghost.className = 'drag-ghost ' + p.c;
    ghost.textContent = GLYPH[p.t];
    ghost.style.fontSize = (size * 0.82) + 'px';
    ghost.style.left = e.clientX + 'px';
    ghost.style.top = e.clientY + 'px';
    var sqEl = squareEl(idx);
    if(sqEl){
      var pe = sqEl.querySelector('.piece');
      if(pe) pe.style.opacity = '0.25';
    }
    document.body.appendChild(ghost);
    drag = { idx: idx, ghost: ghost, moved: false, startX: e.clientX, startY: e.clientY, size: size, lastHover: -1 };
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('pointercancel', onPointerUp);
  }

  function onPointerMove(e){
    if(!drag) return;
    if(Math.abs(e.clientX - drag.startX) > 4 || Math.abs(e.clientY - drag.startY) > 4) drag.moved = true;
    drag.ghost.style.left = e.clientX + 'px';
    drag.ghost.style.top = e.clientY + 'px';

    var el = document.elementFromPoint(e.clientX, e.clientY);
    var sqEl = el && el.closest ? el.closest('.sq') : null;
    var idx = sqEl ? +sqEl.dataset.idx : -1;
    if(idx !== drag.lastHover){
      if(drag.lastHover >= 0){
        var prev = squareEl(drag.lastHover);
        if(prev) prev.classList.remove('hover');
      }
      drag.lastHover = idx;
      if(idx >= 0 && findMoveTo(idx).length && sqEl) sqEl.classList.add('hover');
    }
  }

  function onPointerUp(e){
    window.removeEventListener('pointermove', onPointerMove);
    window.removeEventListener('pointerup', onPointerUp);
    window.removeEventListener('pointercancel', onPointerUp);
    if(!drag) return;
    var d = drag;
    drag = null;

    if(d.ghost.parentNode) d.ghost.remove();
    var homeSq = squareEl(d.idx);
    if(homeSq){
      var pe = homeSq.querySelector('.piece');
      if(pe) pe.style.opacity = '';
    }
    if(d.lastHover >= 0){
      var prev = squareEl(d.lastHover);
      if(prev) prev.classList.remove('hover');
    }

    if(!d.moved){ render(); return; } // 视为点击选中

    var el = document.elementFromPoint(e.clientX, e.clientY);
    var sqEl = el && el.closest ? el.closest('.sq') : null;
    if(!sqEl){ render(); return; }
    var idx = +sqEl.dataset.idx;
    var cands = findMoveTo(idx);
    if(!cands.length){ render(); return; }
    if(cands.length > 1) askPromotion(cands);
    else if(canMoveSide(game.turn)) attemptMove(cands[0]);
    else render();
  }

  function askPromotion(cands){
    promoOpts.innerHTML = '';
    var color = game.turn;
    ['q','r','b','n'].forEach(function(t){
      var b = document.createElement('button');
      b.className = 'promo-opts-item ' + color;
      b.textContent = GLYPH[t];
      b.title = PIECE_NAME[t];
      b.onclick = function(){
        promoOverlay.hidden = true;
        var pick = null;
        for(var i = 0; i < cands.length; i++) if(cands[i].promo === t) pick = cands[i];
        if(pick) attemptMove(pick);
        render();
      };
      promoOpts.appendChild(b);
    });
    promoOverlay.hidden = false;
  }

  /* ---------------- 按钮 ---------------- */
  document.getElementById('btnNew').onclick = function(){ newGame(); };

  document.getElementById('btnUndo').onclick = function(){
    if(aiThinking || !history.length) return;
    var steps = 1;
    if(settings.mode === 'pve'){
      steps = 2;
      // 若当前恰好轮到电脑，撤一步即可回到人类
      if(history.length >= 2 && history[history.length - 1].state.turn === settings.human) steps = 1;
    }
    while(steps-- > 0 && history.length){
      var last = history.pop();
      var key = positionKey(game);
      if(keyCounts[key]) keyCounts[key]--;
      game = last.state;
    }
    allLegal = legalMoves(game);
    lastMove = history.length ? history[history.length - 1].move : null;
    ended = false; endText = '';
    sel = null; selMoves = []; hintFlash = null;
    render();
  };

  document.getElementById('btnFlip').onclick = function(){
    flipped = !flipped;
    buildBoard();
    render();
  };

  document.getElementById('btnHint').onclick = function(){
    if(ended || aiThinking) return;
    if(settings.mode === 'pve' && game.turn !== settings.human) return;
    aiThinking = true; renderStatus();
    setTimeout(function(){
      var m = bestMove(game, 3);
      aiThinking = false;
      if(!m){ render(); return; }
      hintFlash = { from: m.from, to: m.to };
      sel = null; selMoves = [];
      render();
      var san = moveSAN(game, m);
      toast('建议走法：' + san);
      setTimeout(function(){
        hintFlash = null;
        render();
      }, 2200);
    }, 60);
  };

  var btnSound = document.getElementById('btnSound');
  btnSound.onclick = function(){
    soundOn = !soundOn;
    btnSound.textContent = '音效：' + (soundOn ? '开' : '关');
    if(soundOn) sfx('move');
  };

  function bindSeg(id, attr, cb){
    var el = document.getElementById(id);
    el.addEventListener('click', function(e){
      var b = e.target.closest('button');
      if(!b) return;
      var kids = el.querySelectorAll('button');
      for(var i = 0; i < kids.length; i++) kids[i].classList.remove('on');
      b.classList.add('on');
      cb(b.dataset[attr]);
    });
  }

  bindSeg('modeSeg', 'mode', function(v){
    settings.mode = v;
    document.getElementById('pveOpts').style.display = (v === 'pve') ? '' : 'none';
    newGame();
  });
  bindSeg('colorSeg', 'color', function(v){ settings.human = v; flipped = (v === 'b'); buildBoard(); newGame(); });
  bindSeg('levelSeg', 'level', function(v){ settings.level = parseInt(v, 10); });

  document.addEventListener('keydown', function(e){
    var tag = (e.target.tagName || '').toLowerCase();
    if(tag === 'input' || tag === 'textarea') return;
    var k = e.key.toLowerCase();
    if(k === 'u') document.getElementById('btnUndo').click();
    else if(k === 'f') document.getElementById('btnFlip').click();
    else if(k === 'n') document.getElementById('btnNew').click();
    else if(k === 'escape'){ sel = null; selMoves = []; render(); }
  });

  boardEl.addEventListener('pointerdown', onPointerDown);
  boardEl.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  buildBoard();
  newGame();
})();
</script>
